model:
  architecture: 'BiGRUDecoder'
  bidirectional: true
  n_input_features: 512
  n_units: 512
  rnn_dropout: 0.4
  rnn_trainable: true
  n_layers: 4
  patch_size: 14
  patch_stride: 4

  input_network:
    n_input_layers: 1
    input_layer_sizes:
    - 512
    input_trainable: true
    input_layer_dropout: 0.4

gpu_number: '1'
mode: train
use_amp: true

loss:
  ctc_weight: 1.5
  blank_penalty: 0.04

output_dir: ${oc.env:OUTPUT_DIR}
checkpoint_dir: ${oc.env:OUTPUT_DIR}/checkpoint
init_from_checkpoint: false
init_checkpoint_path: false
save_best_checkpoint: true
save_all_val_steps: false
save_final_model: false
save_val_metrics: true
early_stopping: false
early_stopping_val_steps: 20

num_training_batches: 10000
lr_scheduler_type: cosine
lr_max: 0.01
lr_min: 0.0001
lr_decay_steps: 10000
lr_warmup_steps: 1000
lr_max_day: 0.005
lr_min_day: 0.0001
lr_decay_steps_day: 10000
lr_warmup_steps_day: 1000

optimizer_type: adagrad
weight_decay: 0.0005
weight_decay_day: 0
seed: 10
grad_norm_clip_value: 10

batches_per_train_log: 200
batches_per_val_step: 1000

batches_per_save: 0
log_individual_day_val_PER: false
log_val_skip_logs: false
save_val_logits: true
save_val_data: false

dataset:
  data_transforms:
    white_noise_std: 1.0
    constant_offset_std: 0.2
    random_walk_std: 0.0
    random_walk_axis: -1
    static_gain_std: 0.0
    random_cut: 3
    smooth_kernel_size: 100
    smooth_data: true
    smooth_kernel_std: 2
    feature_masking: 0.05
    feature_masking_prob: 0.3
    time_masking: 0.10
    time_masking_prob: 0.5

  neural_dim: 512
  batch_size: 16
  n_classes: 41
  max_seq_elements: 500
  days_per_batch: 2
  seed: 1
  num_dataloader_workers: 4
  loader_shuffle: false
  must_include_days: null
  test_percentage: 0.1
  feature_subset: null

  dataset_dir: ${oc.env:DATA_DIR}
  bad_trials_dict: null
  sessions:
  - t15.2023.08.11
  - t15.2023.08.13
  - t15.2023.08.18
  - t15.2023.08.20
  dataset_probability_val:
  - 0
  - 1
  - 1
  - 1
